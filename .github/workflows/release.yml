# 自动发布工作流 (Obsidian Plugin)
#
# 双触发：手动运行（Actions → Run workflow）或 推送 v* 标签即自动发布。
#
# 手动触发（无需填写任何参数）：
#   1. 自动读取 package.json 的 version（须与 manifest.json 一致）
#   2. 校验版本格式 / versions.json 映射 / 幂等（已发布则整体跳过）
#   3. 门禁：lint + typecheck + test 通过后构建
#   4. 产出 ZIP：obsidian-file-order-<version>.zip（内含 obsidian-file-order/ 子目录）
#   5. 在 github.sha 处自动创建 Git tag <version>，并创建 GitHub Release 附 ZIP
#
# 推送 v* 标签自动发布（幂等，已存在则跳过）：
#   npm version patch|minor|major   # postversion 自动同步 manifest/versions 并构建
#   git push origin main && git push origin v<version>
#
# 双触发去重：手动创建 tag 推送 与 tag 推送事件并发时，由 concurrency 串行排队，
# 配合 detect-version 的幂等检查保证同一版本只发布一次。
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: obsidian-file-order-release
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists:  ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve & validate version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 解析版本：标签触发取自 tag，手动触发取自 package.json（不修改任何版本文件）
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF##*/}"; VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r .version package.json)"
          fi

          # 版本号合法性校验（main.minor.patch），无论是否已发布都必须合法
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非法版本号: $VERSION" >&2; exit 1
          fi

          # 幂等优先判定：已有 Release 则整体跳过（处理手动 + tag 双触发去重）。
          # 用 REST API 的 HTTP 状态码明确区分：200=已存在跳过 / 404=不存在继续 / 其它=真错误终止。
          HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "exists=true"     >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$HTTP_CODE" != "404" ]; then
            echo "查询 Release v$VERSION 状态失败(HTTP $HTTP_CODE)，请检查网络/令牌权限，终止运行" >&2; exit 1
          fi

          # ---- 以下为真正发布前的前置校验 ----
          if [ "${{ github.event_name }}" = "push" ]; then
            # 与 package.json/manifest 一致，防止错标
            MANIFEST="$(jq -r .version manifest.json)"
            PKG="$(jq -r .version package.json)"
            if [ "$VERSION" != "$MANIFEST" ] || [ "$VERSION" != "$PKG" ]; then
              echo "tag v$VERSION 与 manifest.json($MANIFEST)/package.json($PKG) 不一致，中止" >&2; exit 1
            fi
            # 防陈旧标签：tag 必须指向默认分支最新 HEAD，避免在历史 commit 上误发同版本
            DEF_BR="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q '.defaultBranchRef.name')"
            TAG_SHA="$(git rev-parse "v$VERSION^{commit}")"
            HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEF_BR" -q .sha)"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "tag v$VERSION 指向 $TAG_SHA，而默认分支 $DEF_BR 指向 $HEAD_SHA，疑似陈旧 commit 误发，中止" >&2; exit 1
            fi
          fi

          # versions.json 必须包含该版本映射（minAppVersion 降级兼容信息不可缺失）
          if ! jq -e --arg v "$VERSION" '.[$v] != null' versions.json >/dev/null; then
            echo "versions.json 缺少 $VERSION 映射，请先执行 npm version $VERSION 生成，中止" >&2; exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "exists=false"     >> "$GITHUB_OUTPUT"

  build-release:
    needs: detect-version
    if: needs.detect-version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
      # lockfile 的 resolved 锁定在 npmmirror(国内镜像)，在海外 CI 上访问会 ETIMEDOUT。
      # 强制走官方 registry 并 replace-registry-host=always 覆盖 lockfile 内的镜像 host。
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
    steps:
      # 全量历史 + tags：生成 Release notes 需要上一个版本 tag 与提交范围
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 质量门禁（lint + 类型检查 + 单元测试）
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: 构建插件
        run: npm run build

      - name: 打包 ZIP（含 obsidian-file-order/ 子目录）
        run: |
          mkdir -p dist/obsidian-file-order
          cp dist/main.js dist/manifest.json dist/styles.css dist/obsidian-file-order/
          (cd dist && zip -r "../obsidian-file-order-$VERSION.zip" obsidian-file-order)
          ls -la "obsidian-file-order-$VERSION.zip"

      # 生成 Release notes：取上一个版本 tag（排除当前版本）之后的提交摘要（首个版本则列出全部提交）
      - name: 生成提交摘要作为 Release notes
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -v "^v$VERSION$" | head -n1 || true)"
          echo "## 变更" > notes.md
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges "$PREV_TAG"..HEAD >> notes.md
          else
            git log --oneline --no-merges >> notes.md
          fi

      # 创建 Release（tag 不存在时由 API 在 github.sha 处自动创建 v<version>；
      # 若因此触发 push tags 事件重跑，会命中 detect-version 幂等检查秒退）
      - name: 创建 Release 并上传 ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: obsidian-file-order-${{ env.VERSION }}.zip